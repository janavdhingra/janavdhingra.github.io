<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />

<title>Page not found · Janav Dhingra</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />

<style>
  :root { --bg: #f2f3f1; --ink: #1d2224; --muted: #61686a; --accent: #2e5e5a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141716; --ink: #e6e8e5; --muted: #9aa29f; --accent: #8cbcb3; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--ink); font: 17px/1.6 "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 34rem; }
  p.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
  h1 { font: 500 clamp(40px, 7vw, 64px)/1.05 "Newsreader", Georgia, serif; margin: 0; letter-spacing: -.02em; }
  h1 em { font-weight: 400; color: var(--accent); }
  p { color: var(--muted); }
  a { color: var(--ink); font-weight: 600; text-decoration-color: var(--accent); text-underline-offset: 4px; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">404</p>
  <h1>This page doesn't exist. <em>Yet.</em></h1>
  <p>The link might be old, or there might be a typo in the address.</p>
  <p><a href="/">Back to janavdhingra.ca</a></p>
</main>
</body>
